# ── Load-balanced backend pool ────────────────────────────────────
# Scale backend with: docker compose up --scale backend=3
upstream backend_pool {
    least_conn;                  # route to connection with fewest active requests
    server backend:3001;         # Docker DNS resolves to all backend replicas
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    resolver 127.0.0.11 valid=10s;   # Docker internal DNS — re-resolve on scale events

    location /socket.io/ {
        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    "";
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
    }
}
